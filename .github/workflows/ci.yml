name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14.8", "3.15.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/tests.xml
          if-no-files-found: ignore

  profiles:
    name: Profiles (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14.8", "3.15.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run --locked --no-sync python scripts/check_profiles.py core
      - run: uv run --locked --no-sync python scripts/check_profiles.py api
      - run: uv run --locked --no-sync python scripts/check_profiles.py data
      - run: uv run --locked --no-sync python scripts/check_profiles.py notebooks
      - run: uv run --locked --no-sync python scripts/check_capabilities.py
      - run: uv run --locked --no-sync prek validate-config .pre-commit-config.yaml
      - name: Audit selected environment
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.15.0'
        run: uv run --locked --no-sync pip-audit --skip-editable

  check:
    if: always()
    needs: [core, profiles]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require successful jobs
        run: |
          python -c "import json, os, sys; results=json.loads(os.environ['RESULTS']); sys.exit(0 if all(job['result']=='success' for job in results.values()) else 1)"
